# Production stack. Copied to /opt/ezarfeshan by .github/workflows/deploy.yml.
# The image is built in CI and loaded over SSH, so there is no build: here.
# Ebrahim Zarfeshan site on the shared hoosh-vm-01 server (188.121.125.13).
# Isolated like the other products: own compose project, own network, own
# Postgres + volume, every name prefixed "ezarfeshan-", no host ports. Only the
# web container joins the shared Caddy network (vm_default).
name: ezarfeshan

services:
  ezarfeshan-db:
    container_name: ezarfeshan-db
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ezarfeshan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ezarfeshan
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezarfeshan"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    networks: [default]

  ezarfeshan-web:
    container_name: ezarfeshan-web
    image: ezarfeshan-web:latest
    restart: unless-stopped
    depends_on:
      ezarfeshan-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ezarfeshan:${POSTGRES_PASSWORD}@ezarfeshan-db:5432/ezarfeshan
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?required}
      AUTH_SECRET: ${AUTH_SECRET:?required}
      MAIL_DRIVER: ${MAIL_DRIVER:-console}
      MAIL_FROM: ${MAIL_FROM:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    command: sh -c "npx prisma migrate deploy && node server.js"
    mem_limit: 640m
    networks: [default, vm_default]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:

networks:
  vm_default:
    external: true
