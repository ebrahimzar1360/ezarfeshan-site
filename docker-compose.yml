# Local or single-VPS deployment: app + Postgres + Caddy for automatic HTTPS.
#
#   cp .env.example .env      # then fill in the real values
#   docker compose up -d --build
#
# Caddy obtains and renews certificates on its own; nothing here needs certbot.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ezarfeshan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ezarfeshan}
      # C locale keeps index behaviour identical to the development cluster
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ezarfeshan}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # not published to the host: only the app container needs to reach it
    expose:
      - "5432"

  app:
    build:
      context: .
      args:
        # generateStaticParams runs during the build and needs a reachable
        # database; compose resolves `db` on the shared network
        DATABASE_URL: postgresql://${POSTGRES_USER:-ezarfeshan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ezarfeshan}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ezarfeshan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ezarfeshan}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      MAIL_DRIVER: ${MAIL_DRIVER:-console}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    # Migrations run here, not in the image build: the build has no access to
    # the production database and a migration must never run at image-build time.
    command: sh -c "npx prisma migrate deploy && node server.js"
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is required}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
