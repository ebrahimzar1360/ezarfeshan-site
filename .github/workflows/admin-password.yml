name: Set admin password

# Run by hand (Actions -> Set admin password -> Run workflow) to create an
# ADMIN account or replace its password on the production server.
#
# Takes an Argon2id HASH, never a password: workflow inputs are stored with the
# run, so a plain password would end up on GitHub. Make the hash locally:
#
#   node -e "require('@node-rs/argon2').hash(process.argv[1],{memoryCost:19456,timeCost:2,parallelism:1}).then(console.log)" '<password>'
#
# Uses the same VM secrets as deploy.yml.

on:
  workflow_dispatch:
    inputs:
      email:
        description: Admin email (the login)
        required: true
      password_hash:
        description: Argon2id hash of the new password (m=19456,t=2,p=1)
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        env:
          EMAIL: ${{ inputs.email }}
          HASH: ${{ inputs.password_hash }}
        run: |
          [[ "$EMAIL" =~ ^[^[:space:]@\']+@[^[:space:]@\']+\.[^[:space:]@\']+$ ]] || { echo "::error::bad email"; exit 1; }
          [[ "$HASH" =~ ^\$argon2id\$v=19\$m=19456,t=2,p=1\$[A-Za-z0-9+/]+\$[A-Za-z0-9+/]+$ ]] || { echo "::error::bad hash"; exit 1; }

      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_HOST_KEY: ${{ secrets.VM_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_HOST_KEY" > ~/.ssh/known_hosts
          printf 'Host vm\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' \
            "$VM_HOST" "${{ secrets.VM_USER }}" > ~/.ssh/config

      - name: Set password
        env:
          EMAIL: ${{ inputs.email }}
          HASH: ${{ inputs.password_hash }}
        # both values were validated above to contain no quote or space
        run: ssh vm "docker exec ezarfeshan-web node tools/db/set-admin-hash.mjs '$EMAIL' '$HASH'"
